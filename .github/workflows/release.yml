name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

# Workflow-level default is read-only. The one job that needs to write is
# granted it explicitly below, so adding a second job later starts locked down
# rather than inheriting write access it does not need.
permissions:
  contents: read

jobs:
  release:
    name: Build, Publish, and Release
    # Pinned image rather than windows-latest: a release artifact should be
    # reproducible against a known toolchain, not whatever the label points at
    # on the day the tag was pushed.
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write   # required to create GitHub Releases on a public repo

    steps:
      - name: Checkout
        # actions/checkout v4.4.0, pinned to a full commit SHA. This job holds a
        # contents:write token, so running an action from a mutable tag would let
        # a repointed tag write to this repository.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Keep the write-scoped token out of .git/config. The release step
          # receives it through the action's own env, not through git.
          persist-credentials: false

      - name: Setup .NET SDK
        # actions/setup-dotnet v4.3.1, pinned for the same reason.
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          # Must match global.json, which is what actually selects the SDK.
          dotnet-version: '10.0.302'

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"     # e.g. v1.0.0
          $ver = $tag.TrimStart('v')          # 1.0.0
          $asm = "$ver.0"                     # 1.0.0.0 — AssemblyVersion needs 4-part
          "version=$ver"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "assembly=$asm"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Tag: $tag | Version: $ver | AssemblyVersion: $asm"

      - name: Restore
        run: dotnet restore MatrixDesktopApp.sln

      # As in ci.yml: no .pubxml is loaded here, so symbol/doc stripping and
      # ReadyToRun have to be passed explicitly. Without the first three the
      # release zip carried 684,631 bytes of .pdb and WebView2 IntelliSense .xml.
      - name: Publish MatrixDesktop (framework-dependent)
        shell: pwsh
        run: |
          dotnet publish MatrixDesktop\MatrixDesktop.csproj `
            -c Release `
            -r win-x64 `
            --no-self-contained `
            -p:PublishSingleFile=false `
            -p:PublishReadyToRun=true `
            -p:AllowedReferenceRelatedFileExtensions=none `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -p:PublishDir=bin\Publish\win-x64-fd\ `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:AssemblyVersion=${{ steps.version.outputs.assembly }} `
            -p:FileVersion=${{ steps.version.outputs.assembly }}

      - name: Publish MatrixDesktopConfigurator (framework-dependent)
        shell: pwsh
        run: |
          dotnet publish MatrixDesktopConfigurator\MatrixDesktopConfigurator.csproj `
            -c Release `
            -r win-x64 `
            --no-self-contained `
            -p:PublishSingleFile=false `
            -p:PublishReadyToRun=true `
            -p:AllowedReferenceRelatedFileExtensions=none `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -p:PublishDir=bin\Publish\win-x64-fd\ `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:AssemblyVersion=${{ steps.version.outputs.assembly }} `
            -p:FileVersion=${{ steps.version.outputs.assembly }}

      - name: Stage payload and zip
        id: package
        shell: pwsh
        run: |
          $tag     = "${{ github.ref_name }}"
          $stage   = "stage\MatrixDesktop-$tag-win-x64-fd"
          $zipName = "MatrixDesktop-$tag-win-x64-fd.zip"

          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          # Copy MatrixDesktop publish output (EXE + web assets + Matrix.ico)
          Copy-Item -Recurse "MatrixDesktop\bin\Publish\win-x64-fd\*" $stage

          # Copy the complete framework-dependent Configurator publish output
          # into the same stage. The EXE is an apphost and requires its sibling
          # DLL, deps.json, runtimeconfig.json, and managed/native dependencies.
          Copy-Item -Recurse -Force "MatrixDesktopConfigurator\bin\Publish\win-x64-fd\*" $stage

          # Do not publish a ZIP containing an apphost without its managed app.
          #
          # MatrixDesktop.deps.json was missing from this list while the
          # configurator's was present. That file is how the host resolves the
          # WebView2 assemblies and the win-x64 native WebView2Loader.dll, so a
          # zip without it fails at startup with a FileNotFoundException the
          # moment the MainForm touches WebView2 — and this job would still have
          # gone green and published it.
          #
          # The two index.html entries assert that the Content globs actually
          # copied: MatrixDesktop shows a blank window without web\index.html,
          # and the configurator has no UI at all without configurator\index.html.
          $requiredFiles = @(
            "MatrixDesktop.exe",
            "MatrixDesktop.dll",
            "MatrixDesktop.deps.json",
            "MatrixDesktop.runtimeconfig.json",
            "MatrixDesktopConfigurator.exe",
            "MatrixDesktopConfigurator.dll",
            "MatrixDesktopConfigurator.deps.json",
            "MatrixDesktopConfigurator.runtimeconfig.json",
            "web\index.html",
            "configurator\index.html"
          )
          $missingFiles = $requiredFiles | Where-Object {
            -not (Test-Path -LiteralPath (Join-Path $stage $_) -PathType Leaf)
          }
          if ($missingFiles) {
            throw "Release payload is missing required files: $($missingFiles -join ', ')"
          }

          # Top-level docs and license go into the zip too. LICENSE is no longer
          # copied with -ErrorAction SilentlyContinue: MIT requires the notice to
          # travel with the distribution, so a missing LICENSE must fail the
          # release rather than ship a zip with no license in it.
          Copy-Item README.md  $stage
          Copy-Item LICENSE    $stage
          Copy-Item MatrixDesktop_Argument_Guide.txt $stage

          # Final zip
          Compress-Archive -Path "$stage\*" -DestinationPath $zipName -CompressionLevel Optimal

          $zip = Get-Item $zipName
          Write-Host "Created $($zip.Name) — $('{0:N0}' -f $zip.Length) bytes"

          "zip=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Compute SHA256
        shell: pwsh
        run: |
          $zip = "${{ steps.package.outputs.zip }}"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -FilePath "$zip.sha256" -Encoding ascii

      - name: Create GitHub Release
        # softprops/action-gh-release v2.6.2, pinned to a full commit SHA. This is
        # a third-party action and it is the step that receives the contents:write
        # token, which makes it the highest-value pin in either workflow.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.ref_name }}
          name: MatrixDesktop ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256

